<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1 - Fetch JSON From Servlet</title>
</head>
<body>
    <h1>Bài 1: Ứng dụng AJAX đọc dữ liệu từ Servlet</h1>
    <p>Vui lòng nhấn phím <strong>F12</strong> và chọn thẻ <strong>Console</strong> để kiểm tra dữ liệu.</p>
    
    <script>
        // Dùng '../' để lùi ra khỏi thư mục views/ và gọi trúng Servlet
        fetch('../json-employee')
            .then(response => response.json())
            .then(data => {
                console.log("Dữ liệu nhận từ Servlet bài 1:", data);
            })
            .catch(error => {
                console.error("Lỗi khi fetch dữ liệu:", error);
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Upload File Ajax</title>
</head>
<body>
    <h1>Bài 2: Chức năng Upload File với Ajax và Fetch API</h1>
    
    <div style="border: 1px solid #ccc; padding: 20px; width: 400px;">
        <input type="file" id="fileInput"><br><br>
        <button id="btnUpload">Tải lên máy chủ</button>
    </div>

    <div id="resultArea" style="margin-top: 15px;"></div>
    
    <script>
        document.getElementById("btnUpload").addEventListener("click", function() {
        	console.log("Nút đã được bấm! Đang chuẩn bị gửi file...");
            const fileInput = document.getElementById('fileInput');
            const resultArea = document.getElementById('resultArea');

            // 1. Kiểm tra rỗng
            if (fileInput.files.length === 0) {
                resultArea.innerHTML = "<span style='color: red;'>Vui lòng lựa chọn một tập tin!</span>";
                return;
            }

            // 2. Hiển thị trạng thái đang xử lý (UX tốt hơn)
            resultArea.innerHTML = "<span style='color: blue;'>Đang tải lên, vui lòng chờ...</span>";

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            // 3. SỬA LỖI ĐƯỜNG DẪN: Chỉ cần gọi trực tiếp tên mapping của Servlet
            // Trình duyệt sẽ tự nối vào URL hiện tại thành: /Lab8_JAV103/upload-ajax
            fetch('upload-ajax', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Lỗi máy chủ (HTTP " + response.status + ")");
                }
                return response.json();
            })
            .then(data => {
                // 4. Refactor: In dữ liệu trực tiếp ra web thay vì giấu trong Console
                resultArea.innerHTML = `
                    <p style='color: green; font-weight: bold;'>Tải tệp thành công!</p>
                    <ul>
                        <li><b>Tên file:</b> ${data.name}</li>
                        <li><b>Loại tệp:</b> ${data.type}</li>
                        <li><b>Kích thước:</b> ${data.size} bytes</li>
                    </ul>
                `;
            })
            .catch(error => {
                resultArea.innerHTML = `<span style='color: red;'>Gặp lỗi khi tải lên: ${error.message}</span>`;
            });
        });
    </script>
</body>
</html>

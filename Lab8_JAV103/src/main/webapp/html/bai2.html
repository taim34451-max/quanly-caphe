<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lab 08 - Bài 2: Upload File</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .box { padding: 20px; border: 1px solid #ccc; width: 400px; border-radius: 5px; }
        button { margin-top: 10px; padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Upload File bằng Fetch API (Ajax)</h2>
    
    <div class="box">
        <label for="fileInput">Chọn file để tải lên:</label><br><br>
        <input type="file" id="fileInput"><br>
        <button onclick="uploadFile()">Upload</button>
    </div>

    <p><em>Lưu ý: Mở tab <strong>Console</strong> (F12) để xem kết quả JSON trả về.</em></p>

    <script>
        function uploadFile() {
            // Lấy phần tử input file
            const fileInput = document.getElementById('fileInput');
            
            // Kiểm tra xem người dùng đã chọn file chưa
            if (fileInput.files.length === 0) {
                alert("Vui lòng chọn một file trước khi upload!");
                return;
            }

            // Lấy file đầu tiên người dùng chọn
            const file = fileInput.files[0];

            // Sử dụng FormData để đóng gói file gửi đi qua POST
            const formData = new FormData();
            // Tên "uploadFile" ở đây phải khớp chính xác với request.getPart("uploadFile") ở Servlet
            formData.append("uploadFile", file); 

            console.log("Đang tải file lên...");

            // Gọi API (Fetch) đến URL '/bai2' với method POST
            fetch('../bai2', {
                method: 'POST',
                body: formData // Truyền formData chứa file vào body
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Lỗi khi upload file!");
                }
                // Parse phản hồi thành dạng JSON
                return response.json(); 
            })
            .then(data => {
                // Xuất kết quả json ra console theo đúng yêu cầu
                console.log("Upload thành công! Thông tin file nhận được từ Servlet:");
                console.log(data);
                alert("Upload thành công! Kiểm tra Console để xem JSON.");
            })
            .catch(error => {
                console.error("Đã xảy ra lỗi:", error);
            });
        }
    </script>
</body>
</html>
